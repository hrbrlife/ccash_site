baseURL = 'https://cca.sh/'
languageCode = 'en'
title = 'CCASH — Whitelabel Money Services Platform'
disableHugoGeneratorInject = true
canonifyURLs = false
enableRobotsTXT = true

[params]
  description = "CCASH — whitelabel money-services platform. Launch under US FinCEN registration with built-in compliance. Graduate to your own infrastructure when ready."
  author = "CCASH"
  ogImage = "/og-image.png"
  siteName = "CCASH"
  twitterHandle = "@cca_sh"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[[permalinks]]
page = "/:filename.html"

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[taxonomies]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
