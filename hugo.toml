baseURL = 'https://cca.sh/'
languageCode = 'en'
title = 'CCASH — Tokenize Your Community'
disableHugoGeneratorInject = true
canonifyURLs = false
enableRobotsTXT = true

[params]
  description = "Tokenize your community. Start on a proven platform. Graduate to your own self-hosted instance. For family offices, creators, celebrities, sports clubs, lifestyle brands, and retail destinations."
  author = "CCASH"
  ogImage = "/og-image.png"
  siteName = "CCASH"
  twitterHandle = "@cca_sh"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[[permalinks]]
page = "/:filename.html"

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[taxonomies]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
