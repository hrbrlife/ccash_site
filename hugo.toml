baseURL = 'https://cca.sh/'
languageCode = 'en'
title = 'CCASH — Legal Infrastructure & Technology Platform'
disableHugoGeneratorInject = true
canonifyURLs = false
enableRobotsTXT = true

[params]
  description = "CCASH provides a complete legal infrastructure and technology platform for regulated financial services. Entity framework, compliance operations, and a Go + HTMX application platform."
  author = "CCASH Legal & Platform"
  ogImage = "/og-image.png"
  siteName = "CCASH"
  email = "legal@cca.sh"

[outputs]
  home = ["HTML"]
  page = ["HTML"]

[sitemap]
  changefreq = "monthly"
  filename = "sitemap.xml"
  priority = 0.5

[taxonomies]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
