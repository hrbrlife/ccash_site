# ─── ROADMAP DATA ──────────────────────────────────────────────────────────
# Single source of truth for all roadmap milestones.
# Used by both /knowledge/ index cards AND /knowledge/roadmap/ timeline.

current_status: "alpha"
current_status_label:
  en: "Currently in Alpha Development"
  fr: "Actuellement en développement alpha"

hero:
  label:
    en: "Development"
    fr: "Développement"
  title:
    en: "CCASH Roadmap"
    fr: "Feuille de route CCASH"
  description:
    en: "Building a complete legal infrastructure and technology platform for money-services operations. Track our progress from alpha to production."
    fr: "Construire une infrastructure juridique et une plateforme technologique complètes pour les services financiers réglementés. Suivez notre progression de l'alpha à la production."
  subtitle:
    en: "Building a complete legal infrastructure and technology platform for money-services operations. Track our progress from alpha to production."
    fr: "Construire une infrastructure juridique et une plateforme technologique complètes pour les services financiers réglementés. Suivez notre progression de l'alpha à la production."

vision:
  label:
    en: "Our Vision"
    fr: "Notre Vision"
  title:
    en: "Legal Infrastructure for the Next Generation of Financial Services"
    fr: "Infrastructure juridique pour la prochaine génération de services financiers"
  paragraphs:
    - en: "CCASH is building the legal, compliance, and technology stack that money-services operators need to launch and scale. We combine entity frameworks, compliance operations, and a Go + HTMX application platform into a unified offering."
      fr: "CCASH construit la pile juridique, de conformité et technologique dont les opérateurs de services financiers réglementés ont besoin pour lancer et développer leurs activités. Nous combinons des cadres d'entités juridiques, des opérations de conformité et une plateforme d'application Go + HTMX en une offre unifiée."
    - en: "Every milestone on this roadmap brings us closer to a world where MSB operators can deploy complete financial infrastructure in days, not months — with full legal protection, compliance automation, and sovereign control over their data and operations."
      fr: "Chaque jalon de cette feuille de route nous rapproche d'un monde où les opérateurs réglementés peuvent déployer une infrastructure financière complète en jours, pas en mois — avec une protection juridique complète, une automatisation de la conformité et un contrôle souverain sur leurs données et opérations."

phases:
  - id: "foundation"
    number: 1
    title:
      en: "Foundation"
      fr: "Fondation"
    date:
      en: "Q1 – Q2 2026"
      fr: "T1 – T2 2026"
    status: "completed"
    milestones:
      - id: "legal-framework"
        title:
          en: "Legal Entity Framework"
          fr: "Cadre d'entité juridique"
        description:
          en: "Entity formation, operating agreements, and governance structures for MSB operators."
          fr: "Formation d'entités, conventions d'exploitation et structures de gouvernance pour les opérateurs réglementés."
        status: "completed"
        category: "legal"
        tags: ["legal", "compliance"]
        icon: "legal"

      - id: "core-platform"
        title:
          en: "Core Go + HTMX Platform"
          fr: "Plateforme Go + HTMX de base"
        description:
          en: "Application framework built on Go backend with HTMX frontend, featuring modular architecture and hot-reload development."
          fr: "Cadre d'application construit sur un backend Go avec un frontend HTMX, avec une architecture modulaire et un développement à rechargement à chaud."
        status: "completed"
        category: "technical"
        tags: ["technical", "infrastructure"]
        icon: "settings"

      - id: "compliance-baseline"
        title:
          en: "Compliance Operations Baseline"
          fr: "Base des opérations de conformité"
        description:
          en: "KYC/KYB workflows, document management, and audit trail infrastructure."
          fr: "Flux de travail KYC/KYB, gestion de documents et infrastructure de piste d'audit."
        status: "completed"
        category: "compliance"
        tags: ["compliance", "infrastructure"]
        icon: "clipboard"

      - id: "deployment-tooling"
        title:
          en: "Deployment Automation"
          fr: "Automatisation du déploiement"
        description:
          en: "Ansible-based deployment with Docker Compose, nix-bitcoin, and automated provisioning scripts."
          fr: "Déploiement basé sur Ansible avec Docker Compose, nix-bitcoin et scripts d'approvisionnement automatisés."
        status: "completed"
        category: "technical"
        tags: ["technical", "infrastructure"]
        icon: "plug"

  - id: "alpha-launch"
    number: 2
    title:
      en: "Alpha Launch"
      fr: "Lancement alpha"
    date:
      en: "Q2 – Q3 2026"
      fr: "T2 – T3 2026"
    status: "in-progress"
    milestones:
      - id: "private-alpha"
        title:
          en: "Private Alpha Release"
          fr: "Version alpha privée"
        description:
          en: "Private alpha with select partners testing entity formation, compliance workflows, and platform features."
          fr: "Alpha privée avec des partenaires sélectionnés testant la formation d'entités, les flux de conformité et les fonctionnalités de la plateforme."
        status: "completed"
        category: "product"
        tags: ["product", "launch"]
        icon: "zap"

      - id: "entity-portal"
        title:
          en: "Entity Management Portal"
          fr: "Portail de gestion d'entités"
        description:
          en: "Web-based portal for entity creation, document management, and governance workflows."
          fr: "Portail web pour la création d'entités, la gestion de documents et les flux de gouvernance."
        status: "in-progress"
        category: "product"
        tags: ["product", "infrastructure"]
        icon: "building"

      - id: "compliance-engine"
        title:
          en: "Compliance Engine v1"
          fr: "Moteur de conformité v1"
        description:
          en: "Automated compliance checks, document generation, and regulatory reporting templates."
          fr: "Vérifications de conformité automatisées, génération de documents et modèles de rapports réglementaires."
        status: "in-progress"
        category: "compliance"
        tags: ["compliance", "technical"]
        icon: "check"

      - id: "api-documentation"
        title:
          en: "API Documentation & SDK"
          fr: "Documentation API et SDK"
        description:
          en: "Comprehensive API docs, client SDKs, and integration guides for platform partners."
          fr: "Documentation API complète, SDK clients et guides d'intégration pour les partenaires de la plateforme."
        status: "in-progress"
        category: "technical"
        tags: ["technical", "infrastructure"]
        icon: "document"

  - id: "public-launch"
    number: 3
    title:
      en: "Public Launch"
      fr: "Lancement public"
    date:
      en: "Q3 – Q4 2026"
      fr: "T3 – T4 2026"
    status: "upcoming"
    milestones:
      - id: "public-beta"
        title:
          en: "Public Beta"
          fr: "Bêta publique"
        description:
          en: "Open beta with full entity formation, compliance operations, and platform availability."
          fr: "Bêta ouverte avec formation complète d'entités, opérations de conformité et disponibilité de la plateforme."
        status: "upcoming"
        category: "product"
        tags: ["product", "launch"]
        icon: "zap"

      - id: "payment-integration"
        title:
          en: "Payment Operations Module"
          fr: "Module d'opérations de paiement"
        description:
          en: "Integrated payment processing with Go backend, compliance checks, and reporting."
          fr: "Traitement des paiements intégré avec backend Go, vérifications de conformité et reporting."
        status: "upcoming"
        category: "product"
        tags: ["product", "infrastructure"]
        icon: "money"

      - id: "digital-asset-support"
        title:
          en: "Digital Asset Operations Module"
          fr: "Module d'opérations sur actifs numériques"
        description:
          en: "Support for digital asset custody, trading workflows, and regulatory compliance."
          fr: "Prise en charge de la garde d'actifs numériques, des flux de négoce et de la conformité réglementaire."
        status: "upcoming"
        category: "product"
        tags: ["product", "infrastructure"]
        icon: "coins"

      - id: "family-office-suite"
        title:
          en: "Family Office Suite"
          fr: "Suite pour family offices"
        description:
          en: "Dedicated modules for family office operations, reporting, and compliance management."
          fr: "Modules dédiés pour les opérations des family offices, le reporting et la gestion de la conformité."
        status: "upcoming"
        category: "product"
        tags: ["product", "business"]
        icon: "building"

  - id: "growth"
    number: 4
    title:
      en: "Growth & Scale"
      fr: "Croissance et mise à l'échelle"
    date:
      en: "Q1 – Q2 2027"
      fr: "T1 – T2 2027"
    status: "upcoming"
    milestones:
      - id: "multi-jurisdiction"
        title:
          en: "Multi-Jurisdiction Compliance"
          fr: "Conformité multi-juridiction"
        description:
          en: "Expanded compliance coverage for additional US state regulations."
          fr: "Couverture de conformité élargie pour des réglementations supplémentaires des États américains."
        status: "upcoming"
        category: "legal"
        tags: ["legal", "compliance", "expansion"]
        icon: "globe"

      - id: "institutional-partners"
        title:
          en: "Institutional Partner Network"
          fr: "Réseau de partenaires institutionnels"
        description:
          en: "Integration with custodians, auditors, and legal partners for end-to-end service delivery."
          fr: "Intégration avec des dépositaires, auditeurs et partenaires juridiques pour une prestation de services de bout en bout."
        status: "upcoming"
        category: "business"
        tags: ["business", "partnerships"]
        icon: "handshake"

      - id: "advanced-analytics"
        title:
          en: "Advanced Analytics & Reporting"
          fr: "Analytique avancée et reporting"
        description:
          en: "Business intelligence dashboards, custom report builder, and regulatory filing automation."
          fr: "Tableaux de bord décisionnels, générateur de rapports personnalisés et automatisation des dépôts réglementaires."
        status: "future"
        category: "product"
        tags: ["product", "technical"]
        icon: "chart"

      - id: "mobile-access"
        title:
          en: "Mobile Access"
          fr: "Accès mobile"
        description:
          en: "Native mobile applications for compliance approvals, monitoring, and basic operations."
          fr: "Applications mobiles natives pour les approbations de conformité, la surveillance et les opérations de base."
        status: "future"
        category: "product"
        tags: ["product", "mobile"]
        icon: "mobile"

  - id: "platform-maturity"
    number: 5
    title:
      en: "Platform Maturity"
      fr: "Maturité de la plateforme"
    date:
      en: "2027+"
      fr: "2027+"
    status: "future"
    milestones:
      - id: "open-api"
        title:
          en: "Open API Ecosystem"
          fr: "Écosystème API ouvert"
        description:
          en: "Full public API with third-party integration marketplace and developer tools."
          fr: "API publique complète avec place de marché d'intégration tierce et outils développeur."
        status: "future"
        category: "technical"
        tags: ["technical", "infrastructure"]
        icon: "plug"

      - id: "ai-compliance"
        title:
          en: "AI-Powered Compliance"
          fr: "Conformité pilotée par l'IA"
        description:
          en: "Machine learning for automated regulatory monitoring, risk assessment, and anomaly detection."
          fr: "Apprentissage automatique pour la surveillance réglementaire automatisée, l'évaluation des risques et la détection d'anomalies."
        status: "future"
        category: "compliance"
        tags: ["compliance", "technical"]
        icon: "robot"

      - id: "white-label"
        title:
          en: "White-Label Platform"
          fr: "Plateforme marque blanche"
        description:
          en: "Full white-label deployment option for operators wanting their own branded infrastructure."
          fr: "Option de déploiement en marque blanche pour les opérateurs souhaitant leur propre infrastructure de marque."
        status: "future"
        category: "product"
        tags: ["product", "governance"]
        icon: "layers"

      - id: "global-standard"
        title:
          en: "Global Standard"
          fr: "Standard mondial"
        description:
          en: "Become the reference implementation for money-services operations infrastructure."
          fr: "Devenir l'implémentation de référence pour l'infrastructure des opérations de services monétaires."
        status: "future"
        category: "product"
        tags: ["product", "milestone"]
        icon: "globe"

