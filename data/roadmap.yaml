# ─── ROADMAP DATA ──────────────────────────────────────────────────────────
# Single source of truth for all roadmap milestones.
# Used by both /knowledge/ index cards AND /knowledge/roadmap/ timeline.

current_status: "active"
current_status_label:
  en: "Currently Active"
  fr: "Actuellement actif"

hero:
  label:
    en: "Development"
    fr: "Développement"
  title:
    en: "Roadmap"
    fr: "Feuille de route"
  description:
    en: "Building the CCASH legal infrastructure and technology platform. Track our progress from initial release to full ecosystem."
    fr: "Construire l'infrastructure juridique et la plateforme technologique CCASH. Suivez notre progression de la version initiale à l'écosystème complet."

vision:
  label:
    en: "Our Vision"
    fr: "Notre Vision"
  title:
    en: "Legal Infrastructure for the Regulated Economy"
    fr: "Infrastructure Juridique pour l'Économie Réglementée"
  paragraphs:
    - en: "CCASH is building the complete legal infrastructure and technology platform for regulated financial services. Our vision is a world where launching and scaling a regulated operation doesn't require building everything from scratch."
      fr: "CCASH construit l'infrastructure juridique complète et la plateforme technologique pour les services financiers réglementés. Notre vision est un monde où lancer et développer une opération réglementée ne nécessite pas de tout construire à partir de zéro."
    - en: "Every milestone on this roadmap brings us closer to a unified ecosystem where legal framework and technology platform work together seamlessly — enabling operators to focus on their business while we handle the infrastructure."
      fr: "Chaque jalon de cette feuille de route nous rapproche d'un écosystème unifié où le cadre juridique et la plateforme technologique fonctionnent ensemble de manière transparente — permettant aux opérateurs de se concentrer sur leur activité pendant que nous gérons l'infrastructure."

phases:
  - id: "foundation"
    number: 1
    title:
      en: "Foundation"
      fr: "Fondation"
    date:
      en: "Q4 2025 – Q1 2026"
      fr: "T4 2025 – T1 2026"
    status: "completed"
    milestones:
      - id: "legal-framework"
        title:
          en: "Legal Framework v1"
          fr: "Cadre juridique v1"
        description:
          en: "Entity formation, governance documentation, compliance policies, and operational procedures established."
          fr: "Création d'entité, documentation de gouvernance, politiques de conformité et procédures opérationnelles établies."
        status: "completed"
        category: "legal"
        tags: ["legal", "compliance"]
        icon: "landmark"

      - id: "core-platform"
        title:
          en: "Core Platform Architecture"
          fr: "Architecture de la plateforme principale"
        description:
          en: "Go backend, HTMX frontend, encrypted SQLite persistence, and Solana signature integration."
          fr: "Backend Go, frontend HTMX, persistance SQLite cryptée et intégration de signature Solana."
        status: "completed"
        category: "technical"
        tags: ["technical", "infrastructure"]
        icon: "settings"

      - id: "go-htmx-application"
        title:
          en: "Go + HTMX Application"
          fr: "Application Go + HTMX"
        description:
          en: "Single-binary deployment model with mobile-first responsive design and seven-role access control."
          fr: "Modèle de déploiement binaire unique avec design responsive mobile-first et contrôle d'accès à sept rôles."
        status: "completed"
        category: "technical"
        tags: ["technical", "infrastructure"]
        icon: "convert"

      - id: "compliance-framework"
        title:
          en: "Compliance Framework"
          fr: "Cadre de conformité"
        description:
          en: "Compliance policies, KYC/KYB procedures, transaction monitoring, and reporting infrastructure."
          fr: "Politiques de conformité, procédures KYC/KYB, surveillance des transactions et infrastructure de reporting."
        status: "completed"
        category: "compliance"
        tags: ["legal", "compliance"]
        icon: "clipboard"

  - id: "beta-launch"
    number: 2
    title:
      en: "Initial Release"
      fr: "Version initiale"
    date:
      en: "Q2 2026"
      fr: "T2 2026"
    status: "in-progress"
    milestones:
      - id: "platform-release"
        title:
          en: "Platform Release"
          fr: "Lancement de la plateforme"
        description:
          en: "Public release of the combined legal framework and technology platform."
          fr: "Lancement public du cadre juridique et de la plateforme technologique combinés."
        status: "completed"
        category: "product"
        tags: ["product", "launch"]
        icon: "zap"

      - id: "documentation"
        title:
          en: "Documentation Launch"
          fr: "Lancement de la documentation"
        description:
          en: "Complete documentation for both legal framework and technology platform."
          fr: "Documentation complète pour le cadre juridique et la plateforme technologique."
        status: "in-progress"
        category: "product"
        tags: ["product", "infrastructure"]
        icon: "handshake"

      - id: "first-deployment"
        title:
          en: "First Deployments"
          fr: "Premiers déploiements"
        description:
          en: "Initial operator deployments on the CCASH platform."
          fr: "Premiers déploiements d'opérateurs sur la plateforme CCASH."
        status: "in-progress"
        category: "product"
        tags: ["product", "milestone"]
        icon: "money"

      - id: "kyc-integration"
        title:
          en: "KYC/KYB Integration"
          fr: "Intégration KYC/KYB"
        description:
          en: "Third-party verification partners integrated for automated identity verification."
          fr: "Partenaires de vérification tiers intégrés pour la vérification d'identité automatisée."
        status: "in-progress"
        category: "compliance"
        tags: ["compliance", "technical"]
        icon: "check"

  - id: "growth-scale"
    number: 3
    title:
      en: "Growth & Scale"
      fr: "Croissance et montée en charge"
    date:
      en: "Q3 – Q4 2026"
      fr: "T3 – T4 2026"
    status: "upcoming"
    milestones:
      - id: "multi-jurisdiction"
        title:
          en: "Multi-Jurisdiction Expansion"
          fr: "Expansion multi-juridiction"
        description:
          en: "Additional jurisdiction support for legal framework and platform deployment."
          fr: "Support de juridictions supplémentaires pour le cadre juridique et le déploiement de la plateforme."
        status: "upcoming"
        category: "legal"
        tags: ["legal", "compliance", "expansion"]
        icon: "globe"

      - id: "api-platform"
        title:
          en: "API Platform"
          fr: "Plateforme API"
        description:
          en: "Full API access for third-party integrations and custom application development."
          fr: "Accès API complet pour les intégrations tierces et le développement d'applications personnalisées."
        status: "upcoming"
        category: "technical"
        tags: ["technical", "infrastructure"]
        icon: "plug"

      - id: "mobile-experience"
        title:
          en: "Mobile Experience"
          fr: "Expérience mobile"
        description:
          en: "Enhanced mobile-first experience with PWA support across all platform surfaces."
          fr: "Expérience mobile-first améliorée avec support PWA sur toutes les surfaces de la plateforme."
        status: "upcoming"
        category: "product"
        tags: ["product", "mobile"]
        icon: "mobile"

      - id: "governance-tools"
        title:
          en: "Governance Tools"
          fr: "Outils de gouvernance"
        description:
          en: "Multi-party governance and voting tools for operator entity management."
          fr: "Outils de gouvernance multi-parties et de vote pour la gestion des entités opérateur."
        status: "upcoming"
        category: "product"
        tags: ["product", "governance"]
        icon: "building"

  - id: "ecosystem"
    number: 4
    title:
      en: "Ecosystem Maturity"
      fr: "Maturité de l'écosystème"
    date:
      en: "2027+"
      fr: "2027+"
    status: "future"
    milestones:
      - id: "ai-compliance"
        title:
          en: "AI-Powered Compliance"
          fr: "Conformité pilotée par l'IA"
        description:
          en: "Machine learning for real-time regulatory monitoring and reporting."
          fr: "Apprentissage automatique pour la surveillance réglementaire en temps réel et le reporting."
        status: "future"
        category: "compliance"
        tags: ["compliance", "technical"]
        icon: "robot"

      - id: "cross-chain"
        title:
          en: "Cross-Chain Support"
          fr: "Support multi-chaînes"
        description:
          en: "Additional blockchain network integration for signature verification and data anchoring."
          fr: "Intégration de réseaux blockchain supplémentaires pour la vérification des signatures et l'ancrage des données."
        status: "future"
        category: "technical"
        tags: ["technical", "infrastructure"]
        icon: "refresh"

      - id: "open-ecosystem"
        title:
          en: "Open Ecosystem"
          fr: "Écosystème ouvert"
        description:
          en: "Third-party developer platform and extension marketplace for the CCASH ecosystem."
          fr: "Plateforme de développement tierce et marché d'extensions pour l'écosystème CCASH."
        status: "future"
        category: "product"
        tags: ["product", "milestone"]
        icon: "globe"

      - id: "global-standard"
        title:
          en: "Global Standard"
          fr: "Standard mondial"
        description:
          en: "Become the reference implementation for legal infrastructure and technology platform in regulated financial services."
          fr: "Devenir l'implémentation de référence pour l'infrastructure juridique et la plateforme technologique dans les services financiers réglementés."
        status: "future"
        category: "product"
        tags: ["product", "milestone"]
        icon: "globe"

