<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCASH — Legal Infrastructure & Technology Platform</title>
  <meta name="description" content="CCASH — Legal infrastructure and technology platform for regulated financial services. Entity framework, compliance operations, and a Go + HTMX application platform.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://cca.sh/">
  <meta property="og:title" content="CCASH — Legal Infrastructure & Technology Platform">
  <meta property="og:description" content="Legal infrastructure meets technology platform. Entity framework, compliance operations, and Go + HTMX application platform.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://cca.sh">
  <meta property="og:image" content="https://cca.sh/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="CCASH — Legal Infrastructure & Technology Platform">
  <meta name="twitter:description" content="Legal infrastructure meets technology platform.">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 17px; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #0c0f15;
      color: #e0e4ec;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .container {
      max-width: 560px;
    }
    .logo {
      display: inline-flex; align-items: center; justify-content: center;
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #c9952a, #a87a1e);
      border-radius: 10px; color: #0c0f15;
      font-family: Georgia, serif;
      font-size: 1.4rem; font-weight: 800;
      margin-bottom: 1.5rem;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 0.35em 1em;
      border-radius: 100px;
      background: rgba(201, 149, 42, 0.15);
      color: #c9952a;
      margin-bottom: 1.5rem;
    }
    .badge-reg {
      background: rgba(45, 212, 191, 0.15);
      color: #2dd4bf;
      margin-left: 0.5rem;
    }
    h1 {
      font-size: 2.6rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.3rem;
      letter-spacing: -0.02em;
      font-family: Georgia, serif;
    }
    .subtitle {
      font-size: 1rem;
      color: #94a3b8;
      font-weight: 500;
      margin-bottom: 2rem;
    }
    .desc {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #b0b8c8;
      margin-bottom: 2.5rem;
    }
    .back-link {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #c9952a;
      text-decoration: none;
      border: 1px solid rgba(201, 149, 42, 0.3);
      padding: 0.6em 1.6em;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .back-link:hover {
      background: rgba(201, 149, 42, 0.1);
      border-color: #c9952a;
    }
    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.72rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">CC</div>
    <div>
      <span class="badge">Legal Framework</span>
      <span class="badge badge-reg">Go + HTMX</span>
    </div>
    <h1>CCASH</h1>
    <p class="subtitle">Legal Infrastructure &middot; Technology Platform</p>
    <p class="desc">Legal infrastructure and technology platform for regulated financial services. Entity framework, compliance operations, and a full Go + HTMX application platform — all under one roof.</p>
    <a href="https://cca.sh" class="back-link">Explore CCASH &rarr;</a>
  </div>
  <footer>&copy; 2026 CCASH</footer>
</body>
</html>
